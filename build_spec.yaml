version: 0.1
component: build
timeoutInSeconds: 900
shell: bash

env:
  variables:
    JAVA_HOME: /usr/lib64/graalvm/graalvm-java22
    DOCKER_REGISTRY: docker.io/dockerdiegojules
    DOCKER_USERNAME: dockerdiegojules
  vaultVariables:
    DOCKERHUB_TOKEN: ocid1.vaultsecret.oc1.mx-queretaro-1.amaaaaaatmkmvoaafaoqzlq25wbpuxfo4xkelyeg7t3fag35zprcgr5tzmkq
  exportedVariables:
    - IMAGE_VERSION

steps:
  - type: Command
    name: "Install GraalVM Enterprise 22.x Native Image for Java22"
    command: |
      yum -y install graalvm-22-jdk.x86_64
      ls /usr/lib64/graalvm/

  - type: Command
    name: "Set PATH Variable"
    command: |
      export PATH=$JAVA_HOME/bin:$PATH
      java -version
      mvn -version

  - type: Command
    name: "Check backend folder"
    command: |
      cd MtdrSpring
      pwd
      ls -la
      ls -la backend

  - type: Command
    name: "Validate Kubernetes manifest YAML"
    command: |
      python3 -m pip install --quiet pyyaml
      python3 -c "
      import yaml
      path = 'MtdrSpring/backend/src/main/resources/todolistapp-springboot.yaml'
      with open(path) as f:
          docs = list(yaml.safe_load_all(f))
      if len(docs) < 1:
          raise SystemExit('Manifest must contain at least one Kubernetes document')
      print('OK: parsed', len(docs), 'documents from', path)
      "

  - type: Command
    name: "Automated tests"
    command: |
      export PATH=$JAVA_HOME/bin:$PATH
      cd MtdrSpring/backend
      mvn -B test -Dspring.profiles.active=test

  - type: Command
    name: "Docker Hub Login"
    command: |
      echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "dockerdiegojules" --password-stdin

  - type: Command
    name: "Build"
    command: |
      cd MtdrSpring
      export IMAGE_VERSION=$(git rev-parse --short HEAD)
      echo "IMAGE_VERSION=[$IMAGE_VERSION]"
      source env.sh
      cd backend
      bash build.sh