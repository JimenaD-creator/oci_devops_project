version: 0.1
component: build
timeoutInSeconds: 600
shell: bash

env:
  variables:
    JAVA_HOME: /usr/lib64/graalvm/graalvm-java22
    DOCKER_REGISTRY: docker.io/dockerdiegojules
  vaultVariables:
    DOCKERHUB_TOKEN: ocid1.vaultsecret.oc1.mx-queretaro-1.amaaaaaatmkmvoaafaoqzlq25wbpuxfo4xkelyeg7t3fag35zprcgr5tzmkq
  exportedVariables:
    - IMAGE_VERSION

steps:
  - type: Command
    name: "Install GraalVM Enterprise 22.x Native Image for Java22"
    command: |
      yum -y install graalvm-22-jdk.x86_64
      ls /usr/lib64/graalvm/

  - type: Command
    name: "Set PATH Variable"
    command: |
      export PATH=$JAVA_HOME/bin:$PATH
      java -version
      mvn -version

  - type: Command
    name: "Check backend folder"
    command: |
      cd MtdrSpring
      pwd
      ls -la
      ls -la backend

  - type: Command
    name: "Docker Hub Login"
    command: |
      echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

  - type: Command
    name: "Build"
    command: |
      cd MtdrSpring
      export IMAGE_VERSION=$(git rev-parse --short HEAD)
      echo "IMAGE_VERSION=[$IMAGE_VERSION]"
      source env.sh
      cd backend
      bash build.sh