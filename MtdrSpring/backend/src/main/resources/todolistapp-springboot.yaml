apiVersion: v1
kind: Service
metadata:
  name: todolistapp-springboot-service
  annotations:
    oci.oraclecloud.com/loadbalancer-policy: "IP_HASH"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - port: 80
      protocol: TCP
      targetPort: 8080
  selector:
    app: todolistapp-springboot
---
apiVersion: v1
kind: Service
metadata:
  name: todolistapp-backend-router
spec:
  selector:
    app: todolistapp-springboot
  ports:
    - protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolistapp-springboot-deployment
spec:
  selector:
    matchLabels:
      app: todolistapp-springboot
  replicas: 2
  template:
    metadata:
      labels:
        app: todolistapp-springboot
        version: v1
    spec:
      containers:
        - name: todolistapp-springboot
          image: docker.io/dockerdiegojules/todolistapp-springboot:${IMAGE_VERSION}
          imagePullPolicy: Always
          env:
            - name: DB_USERNAME
              value: "MANAGER"
            - name: DB_URL
              value: "jdbc:oracle:thin:@reacttodo2p9ml_tp?TNS_ADMIN=/mtdrworkshop/creds"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dbuser
                  key: dbpassword
                  optional: false
            - name: UI_USERNAME
              value: "%UI_USERNAME%"
            - name: UI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frontendadmin
                  key: password
                  optional: false
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-bot-secret
                  key: token
                  optional: false
            - name: TELEGRAM_BOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: telegram-bot-secret
                  key: username
                  optional: false
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-secret
                  key: api-key
                  optional: false
            - name: OCI_REGION
              value: "%OCI_REGION%"
            # Cross-pod SSE: Telegram may hit pod A while browser SSE is on pod B (replicas > 1).
            - name: REALTIME_RELAY_ENABLED
              value: "true"
          volumeMounts:
            - name: creds
              mountPath: /mtdrworkshop/creds
          ports:
            - name: http
              containerPort: 8080
      restartPolicy: Always
      volumes:
        - name: creds
          secret:
            secretName: db-wallet-secret
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: todolistapp-springboot