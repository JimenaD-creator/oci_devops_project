spring.datasource.url=jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

telegram.bot.token=test-token
telegram.bot.name=test-bot
gemini.api.key=test-gemini-key
vector.search.mode=application
deepseek.api.key=test-deepseek-key
app.jwt.secret=test-secret-at-least-32-characters-long
app.jwt.expiration-minutes=480
app.realtime.relay.enabled=false
