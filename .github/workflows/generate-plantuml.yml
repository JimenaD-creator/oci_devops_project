name: Generate PlantUML diagrams

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-plantuml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          cache: maven

      - name: Generate PlantUML diagrams
        run: |
          cd MtdrSpring/backend
          mvn -Pgenerate-puml -DskipTests -Dskip.installnodenpm=true -Dskip.npm=true process-classes

      - name: Commit generated PlantUML diagrams
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: regenerate PlantUML diagrams"
          file_pattern: "docs/diagrams/*.puml"
